spring.application.name=backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/autoecole_db}
spring.datasource.username=${DATABASE_USERNAME:autoecole_user}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
autoecole.mail.from=${SMTP_FROM:no-reply@localhost}
autoecole.verification.public-url=${PUBLIC_VERIFICATION_URL:http://localhost:8080/api/auth/verify}
autoecole.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
autoecole.auth.verification-ttl-minutes=${VERIFICATION_TTL_MINUTES:30}
autoecole.auth.session-ttl-days=${SESSION_TTL_DAYS:30}
autoecole.admin.email=${ADMIN_EMAIL:}
autoecole.admin.password=${ADMIN_PASSWORD:}
